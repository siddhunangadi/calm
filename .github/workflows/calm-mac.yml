name: Calm Mac build

on:
  push:
    paths:
      - "mac/**"
      - ".github/workflows/calm-mac.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS 15 has Xcode 16, which includes the Swift "Testing" library the tests use.
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Extension rule tests
        run: osascript -l JavaScript Tests/ExtensionRules/rules-test.js "$PWD/Resources/blankpage/rules.js"
      - name: Build installer
        run: ./scripts/build-pkg.sh
      - name: Upload Calm.pkg
        uses: actions/upload-artifact@v4
        with:
          name: Calm-installer
          path: mac/build/Calm.pkg
      # Each new number in mac/VERSION becomes a release; installed copies offer it as "Update now".
      - name: Publish release (only for a new version)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="calm-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already published; nothing to do."
          else
            gh release create "$tag" build/Calm.pkg --target "$GITHUB_SHA" \
              --title "Calm $version" --notes "Calm for Mac $version. Update from the leaf menu, or install Calm.pkg."
          fi
